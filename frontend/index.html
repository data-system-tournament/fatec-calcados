<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fatec-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FATECalçados · Programa de Fidelidade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Aplica as configurações de acessibilidade (hooks/useAcessibilidade.ts) antes da primeira pintura,
      // para a página não abrir com a letra pequena e depois pular.
      try {
        var a = JSON.parse(localStorage.getItem("fatec:acessibilidade") || "{}");
        var r = document.documentElement;
        if (a.fonte && a.fonte !== "normal") r.setAttribute("data-fonte", a.fonte);
        if (a.contrasteAlto) r.setAttribute("data-contraste", "alto");
        if (a.espacamentoAmplo) r.setAttribute("data-espacamento", "amplo");
        if (a.reduzirMovimento) r.setAttribute("data-movimento", "reduzido");
        if (a.sublinharLinks) r.setAttribute("data-links", "sublinhados");
      } catch (e) {}

      // Aplica o tema salvo (hooks/useTema.ts, fatec:tema) antes de pintar a página, para não piscar no tema errado.
      try {
        var tema = localStorage.getItem("fatec:tema");
        if (tema === "claro") document.documentElement.dataset.theme = "light";
        if (tema === "escuro") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
