services:
  frontend:
    build: ./frontend
    working_dir: /app
    # O node_modules fica num volume, que não é atualizado pelo --build.
    # Reinstala só quando o package-lock.json mudou desde a última instalação.
    command: >
      sh -c "cmp -s package-lock.json node_modules/.lock-instalado
      || (npm ci && cp package-lock.json node_modules/.lock-instalado);
      npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - API_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: fatec
      POSTGRES_PASSWORD: fatec
      POSTGRES_DB: fatec_calcados
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fatec
      POSTGRES_PASSWORD: fatec
      POSTGRES_DB: fatec_calcados
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatec -d fatec_calcados"]
      interval: 5s
      retries: 10

volumes:
  frontend_node_modules:
  db_data:
